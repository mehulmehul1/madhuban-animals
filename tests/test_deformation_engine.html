<!DOCTYPE html>
<html>

<head>
    <title>Test: Deformation Engine (Phase 2)</title>
    <style>
        body {
            font-family: sans-serif;
            padding: 20px;
        }

        .pass {
            color: green;
        }

        .fail {
            color: red;
            font-weight: bold;
        }

        .test-group {
            margin-bottom: 20px;
            border: 1px solid #ccc;
            padding: 10px;
        }

        h3 {
            margin-top: 0;
        }
    </style>
</head>

<body>
    <h1>Phase 2: Deformation Engine Tests</h1>
    <div id="results"></div>

    <!-- Load System -->
    <script src="../app/systems/deformation-engine.js"></script>

    <script>
        const results = document.getElementById('results');
        const engine = new DeformationEngine();

        function log(message, type = 'info') {
            const div = document.createElement('div');
            div.textContent = message;
            if (type === 'pass') div.className = 'pass';
            if (type === 'fail') div.className = 'fail';
            results.appendChild(div);
        }

        function assert(condition, message) {
            if (condition) {
                log(`✓ ${message}`, 'pass');
                return true;
            } else {
                log(`✗ ${message}`, 'fail');
                return false;
            }
        }

        function runTests() {
            log('Starting Tests...');

            // --- Setup Mock Data ---
            const mockMuscle = {
                id: 'test_muscle',
                width: 20,
                twistSensitivity: 1.0,
                deformationRules: {
                    stretch: { widthMultiplier: 0.5, bulgeFactor: 0.8, addStriations: true },
                    compress: { widthMultiplier: 1.5, bulgeFactor: 1.2 },
                    twist: { sensitivity: 1.0 }
                }
            };

            // --- Test 1: Stretch Logic ---
            log('--- Test 1: Stretch Logic ---');
            const stretchMetrics = { state: 'stretch', ratio: 1.2, twistAngle: 0 };

            // First frame (initialization, might jump or smooth from default)
            // The engine initializes prev state to target on first run usually, or 0.
            // Let's check the logic. Code says: prev = map.get || {width: target...}
            // So first run should be instant target.

            let def = engine.getDeformation(mockMuscle, stretchMetrics);

            // Target width = 20 * 0.5 = 10
            assert(Math.abs(def.width - 10) < 0.1, `Stretch Width should be 10 (Got: ${def.width})`);
            assert(def.showStriations === true, `Striations should be true`);

            // --- Test 2: Compression Logic ---
            log('--- Test 2: Compression Logic ---');
            const compressMetrics = { state: 'compress', ratio: 0.8, twistAngle: 0 };

            // Run multiple times to let smoothing settle
            // Target width = 20 * 1.5 = 30
            // Start is 10. Speed is 0.2.
            // Frame 1: 10 + (30-10)*0.2 = 14

            def = engine.getDeformation(mockMuscle, compressMetrics);
            assert(def.width > 10 && def.width < 30, `Smoothing: Width should be increasing (Got: ${def.width})`);

            // Simulate 20 frames
            for (let i = 0; i < 20; i++) {
                def = engine.getDeformation(mockMuscle, compressMetrics);
            }
            assert(Math.abs(def.width - 30) < 1.0, `Settled Width should be ~30 (Got: ${def.width})`);
            assert(def.showStriations === false, `Striations should be false`);

            // --- Test 3: Twist Logic ---
            log('--- Test 3: Twist Logic ---');
            const twistMetrics = { state: 'rest', ratio: 1.0, twistAngle: 45 }; // 45 deg twist

            // Reset engine to clear smoothing
            const engine2 = new DeformationEngine();
            def = engine2.getDeformation(mockMuscle, twistMetrics);

            // Offset calculation: 0.5 + (45/180 * 1.0 * 0.5) = 0.5 + 0.125 = 0.625
            // Wait, formula: 0.5 + (twistEffect * 0.5)
            // twistEffect = (45/180) * 1.0 = 0.25
            // Result = 0.5 + 0.125 = 0.625

            assert(Math.abs(def.offset - 0.625) < 0.01, `Twist Offset should be ~0.625 (Got: ${def.offset})`);

            log('Tests Complete.');
        }

        runTests();
    </script>
</body>

</html>
